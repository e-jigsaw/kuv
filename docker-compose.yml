services:
  postgres:
    profiles: ["dev"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kuv
      POSTGRES_USER: kuv
      POSTGRES_PASSWORD: kuv
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuv -d kuv"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data

  s3:
    profiles: ["dev"]
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-s3", "-dir=/data"]
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    environment:
      PORT: 3001
      KUV_JWT_SECRET: ${KUV_JWT_SECRET}
      KUV_DB_HOST: ${KUV_DB_HOST:-postgres}
      KUV_DB_PORT: ${KUV_DB_PORT:-5432}
      KUV_DB_USER: ${KUV_DB_USER:-kuv}
      KUV_DB_PASSWORD: ${KUV_DB_PASSWORD:-kuv}
      KUV_DB_DATABASE: ${KUV_DB_DATABASE:-kuv}
      KUV_S3_ENDPOINT: ${KUV_S3_ENDPOINT}
      KUV_S3_REGION: ${KUV_S3_REGION:-us-east-1}
      KUV_S3_BUCKET: ${KUV_S3_BUCKET}
      KUV_S3_ACCESS_KEY: ${KUV_S3_ACCESS_KEY}
      KUV_S3_SECRET_KEY: ${KUV_S3_SECRET_KEY}

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    environment:
      PORT: 3000
      KUV_API_BASE: http://api:3001
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      # Caddyfile だけは bind-mount（設定変更でイメージ再ビルドしないため）
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - web
      - api

volumes:
  db-data:
  s3-data:
